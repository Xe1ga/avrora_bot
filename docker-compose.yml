services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avrora_bot}
      POSTGRES_USER: ${POSTGRES_USER:-avrora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт проброшен только на localhost хоста (WSL2) — не в интернет.
    # Windows видит его как localhost:5432 благодаря сетевой интеграции WSL2.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avrora} -d ${POSTGRES_DB:-avrora_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри сети compose БД доступна по имени сервиса.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
